<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hyundai Elantra N Drive</title><style>html,body{margin:0;overflow:hidden;background:#10151c;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:absolute;top:12px;left:12px;color:white;background:#0009;border-radius:12px;padding:12px;direction:ltr}#msg{position:absolute;top:40%;width:100%;text-align:center;color:white;font-size:20px;text-shadow:0 2px 5px black;pointer-events:none}#controls{position:absolute;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;direction:ltr;pointer-events:none}.group{display:flex;gap:10px}button{pointer-events:auto;border:2px solid #ffffff80;border-radius:15px;background:#151d27b9;color:white;font-weight:bold;font-size:22px;width:70px;height:70px;touch-action:none;user-select:none}button:active,.held{background:#3375bb}#reset{position:absolute;top:12px;right:12px;width:auto;height:auto;padding:12px;font-size:14px}#help{position:absolute;bottom:100px;width:100%;text-align:center;color:white;text-shadow:0 2px 4px #000;font-size:13px}</style></head><body><div id="hud"><b>ELANTRA N</b><br><span id="speed">0</span> km/h</div><button id="reset">إعادة السيارة</button><div id="msg">جاري تحميل الخريطة والسيارة...</div><div id="help">الأسهم أو WASD للقيادة • اضغط الفرامل للرجوع للخلف</div><div id="controls"><div class="group"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="group"><button data-key="brake">▼</button><button data-key="gas">▲</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa7c5e2);scene.fog=new THREE.Fog(0xa7c5e2,80,190);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x5a6878,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(20,40,20);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x626d68,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
const loader=new GLTFLoader();const msg=document.querySelector('#msg');const keys={left:false,right:false,gas:false,brake:false};let car,heading=0,speed=0,ready=false;const pos=new THREE.Vector3(0,.35,0);const clock=new THREE.Clock();const carRoot=new THREE.Group();scene.add(carRoot);function reset(){pos.set(0,.35,0);heading=0;speed=0}document.querySelector('#reset').onclick=reset;for(const b of document.querySelectorAll('[data-key]')){let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;b.classList.add('held')});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>{keys[k]=false;b.classList.remove('held')})}const mapKey={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',a:'left',d:'right',w:'gas',s:'brake'};addEventListener('keydown',e=>{const k=mapKey[e.key];if(k){keys[k]=true;e.preventDefault()}});addEventListener('keyup',e=>{const k=mapKey[e.key];if(k)keys[k]=false});addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
function load(url){return new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject))}try{msg.textContent='جاري تحميل الخريطة...';const map=await load('./map_njxz.glb');scene.add(map.scene);msg.textContent='جاري تحميل السيارة...';const c=await load('./2021-2023_hyundai_elantra_n-compressed.glb');car=c.scene;carRoot.add(car);car.scale.setScalar(280);const box=new THREE.Box3().setFromObject(car);const center=box.getCenter(new THREE.Vector3());car.position.sub(center);car.rotation.y=Math.PI;ready=true;msg.textContent='انطلق!';setTimeout(()=>msg.textContent='',1700)}catch(e){msg.textContent='تعذر تحميل الملفات. افتح اللعبة عبر خادم ويب، وليس file://';console.error(e)}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(ready){const accel=keys.gas?13:0,brake=keys.brake?18:0;speed+=((accel-brake)-speed*.65)*dt;speed=THREE.MathUtils.clamp(speed,-10,26);if(!keys.gas&&!keys.brake)speed*=Math.exp(-1.4*dt);const steer=(keys.left?1:0)-(keys.right?1:0);heading+=steer*speed*dt*.055;pos.x+=Math.sin(heading)*speed*dt;pos.z+=Math.cos(heading)*speed*dt;pos.x=THREE.MathUtils.clamp(pos.x,-31,31);pos.z=THREE.MathUtils.clamp(pos.z,-31,31);carRoot.position.copy(pos);carRoot.rotation.y=heading;document.querySelector('#speed').textContent=Math.round(Math.abs(speed)*3.6);const target=pos.clone().add(new THREE.Vector3(-Math.sin(heading)*10,5.4,-Math.cos(heading)*10));camera.position.lerp(target,Math.min(1,dt*5));camera.lookAt(pos.x,pos.y+1.3,pos.z)}else{camera.position.set(12,10,12);camera.lookAt(0,0,0)}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
