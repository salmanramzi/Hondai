<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hyundai Elantra N Drive</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101820;font-family:Arial,sans-serif;touch-action:none}#hud{position:absolute;top:12px;left:12px;direction:ltr;color:white;background:#0009;border-radius:12px;padding:12px;font-weight:bold}#status{position:absolute;top:38%;width:100%;text-align:center;color:white;font-size:18px;text-shadow:0 2px 5px black;padding:15px}#controls{position:absolute;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;direction:ltr;pointer-events:none}.group{display:flex;gap:10px}button{pointer-events:auto;border:2px solid #ffffff99;border-radius:16px;background:#162433c9;color:white;font-size:26px;font-weight:bold;width:72px;height:72px;touch-action:none}button:active{background:#3788d4}#reset{position:absolute;top:12px;right:12px;width:auto;height:auto;padding:12px;font-size:14px}#tip{position:absolute;bottom:103px;color:white;text-align:center;width:100%;font-size:13px;text-shadow:0 1px 4px #000}</style></head><body><div id="hud">ELANTRA N<br><span id="speed">0</span> km/h</div><button id="reset">إعادة السيارة</button><div id="status">جاري تحميل الخريطة والسيارة...</div><div id="tip">▲ بنزين · ▼ فرامل / رجوع · ◀ ▶ توجيه</div><div id="controls"><div class="group"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="group"><button data-key="brake">▼</button><button data-key="gas">▲</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const status=document.querySelector('#status'),speedEl=document.querySelector('#speed');const scene=new THREE.Scene();scene.background=new THREE.Color(0xaac9e5);scene.fog=new THREE.Fog(0xaac9e5,100,240);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,600);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x666677,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(30,70,25);scene.add(sun);

const loader=new GLTFLoader();
const load=file=>new Promise((ok,fail)=>loader.load('./'+file,ok,undefined,fail));
const keys={left:false,right:false,gas:false,brake:false};
let map,car,roadMeshes=[],roadBounds,heading=0,velocity=0,groundY=0,laps=0,checkpoint=0,track=[];
const raycaster=new THREE.Raycaster();
const up=new THREE.Vector3(0,1,0);
const hud=document.createElement('div');
hud.style.cssText='position:fixed;top:75px;left:12px;color:white;background:#101b2dbb;border-radius:12px;padding:10px 15px;font:bold 16px Arial;direction:rtl;z-index:10';
hud.innerHTML='اللفة: <span id="lapCounter">0</span> / 3';
document.body.appendChild(hud);
const msg=document.querySelector('#status')||document.querySelector('#msg')||document.createElement('div');
const carRoot=new THREE.Group();scene.add(carRoot);
function roadSurface(x,z){
 if(!roadMeshes.length)return null;
 raycaster.set(new THREE.Vector3(x,roadBounds.max.y+500,z),new THREE.Vector3(0,-1,0));
 raycaster.far=2000;
 const hits=raycaster.intersectObjects(roadMeshes,false);
 for(const hit of hits){
  const normal=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  if(Math.abs(normal.y)>.65)return hit.point.y;
 }
 return null;
}
function findRoad(x,z){
 const step=Math.max(1.5,Math.min(8,Math.max(roadBounds.max.x-roadBounds.min.x,roadBounds.max.z-roadBounds.min.z)/70));
 for(let r=0;r<40;r++){
  for(let k=0;k<Math.max(12,r*12);k++){
   const a=k*2*Math.PI/Math.max(12,r*12),px=x+Math.cos(a)*r*step,pz=z+Math.sin(a)*r*step;
   if(px<roadBounds.min.x||px>roadBounds.max.x||pz<roadBounds.min.z||pz>roadBounds.max.z)continue;
   const y=roadSurface(px,pz);
   if(y!==null)return new THREE.Vector3(px,y,pz);
  }
 }
 return null;
}
function reset(){
 if(!car||!track.length)return;
 velocity=0;heading=Math.atan2(track[1].x-track[0].x,track[1].z-track[0].z);
 carRoot.position.copy(track[0]);carRoot.rotation.y=heading;
 camera.position.copy(carRoot.position).add(new THREE.Vector3(-Math.sin(heading)*8,4,-Math.cos(heading)*8));camera.lookAt(carRoot.position.clone().add(new THREE.Vector3(0,1.5,0)));
 checkpoint=1;laps=0;document.querySelector('#lapCounter').textContent=laps;
}
function makeTrack(){
 const c=roadBounds.getCenter(new THREE.Vector3());
 const width=roadBounds.max.x-roadBounds.min.x,depth=roadBounds.max.z-roadBounds.min.z;
 // Sample an elliptical route, snapping every checkpoint to actual road geometry.
 const points=[];for(let i=0;i<8;i++){ 
  const a=2*Math.PI*i/8;
  const pt=findRoad(c.x+Math.cos(a)*width*.29,c.z+Math.sin(a)*depth*.29);
  if(pt && (!points.length||pt.distanceTo(points[points.length-1])>3))points.push(pt);
 }
 if(points.length<4){
  const p=findRoad(c.x,c.z);
  if(p){points.length=0;points.push(p);}
 }
 if(points.length>=4){const mid=roadBounds.getCenter(new THREE.Vector3());let closest=0,best=Infinity;points.forEach((p,i)=>{const d=p.distanceToSquared(mid);if(d<best){best=d;closest=i}});track=points.slice(closest).concat(points.slice(0,closest));}else track=points;
 // The markers show the route and do not replace the original road geometry.
 const markerGeometry=new THREE.RingGeometry(.65,1.0,24);
 const markerMaterial=new THREE.MeshBasicMaterial({color:0x18e5ff,side:THREE.DoubleSide,transparent:true,opacity:.85,depthWrite:false});
 for(const pt of track){
  const m=new THREE.Mesh(markerGeometry,markerMaterial);m.position.copy(pt);m.position.y+=.12;m.rotation.x=-Math.PI/2;scene.add(m);
 }
}
async function start(){
 try{
  msg.textContent='جاري تحميل الماب...';
  map=(await load('map_njxz.glb')).scene;scene.add(map);map.updateMatrixWorld(true);
  map.traverse(o=>{
   if(!o.isMesh)return;
   const n=o.name.toLowerCase();
   if(n.includes('road')&&!n.includes('mini')&&!n.includes('pick')&&!n.includes('cao')&&!n.includes('grass'))roadMeshes.push(o);
  });
  if(!roadMeshes.length)throw Error('لم أجد مجسم الشارع في الماب');
  roadBounds=new THREE.Box3();
  roadMeshes.forEach(o=>roadBounds.expandByObject(o));
  makeTrack();
  if(!track.length)throw Error('تعذر تحديد سطح الشارع');
  msg.textContent='جاري تحميل السيارة...';
  const model=(await load('2021-2023_hyundai_elantra_n.glb')).scene;
  model.updateMatrixWorld(true);
  let bounds=new THREE.Box3().setFromObject(model);
  let size=bounds.getSize(new THREE.Vector3());
  // Normalize the car size to road width, instead of using the original arbitrary GLB scale.
  const roadWidth=Math.min(roadBounds.max.x-roadBounds.min.x,roadBounds.max.z-roadBounds.min.z);
  const desiredLength=Math.max(2.8,Math.min(6,roadWidth*.065));
  model.scale.multiplyScalar(desiredLength/Math.max(size.x,size.z,.001));
  model.updateMatrixWorld(true);
  bounds.setFromObject(model);
  const center=bounds.getCenter(new THREE.Vector3());
  model.position.x-=center.x;model.position.z-=center.z;model.position.y-=bounds.min.y;
  carRoot.add(model);car=carRoot;reset();
  msg.style.display='none';
 }catch(e){console.error(e);msg.textContent='خطأ: '+e.message;msg.style.display='block';}
}
start();
document.querySelectorAll('[data-key]').forEach(b=>{
 const k=b.dataset.key;
 const set=v=>{keys[k]=v;b.style.background=v?'#3788d4':''};
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>set(false)));
});
document.querySelector('#reset').onclick=reset;
const keyMap={ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=false});
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock(),look=new THREE.Vector3();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);
 if(car){
  velocity+=(keys.gas?12:keys.brake?-15:0)*dt;
  if(!keys.gas&&!keys.brake)velocity*=Math.exp(-2*dt);
  velocity=THREE.MathUtils.clamp(velocity,-9,23);
  const steer=(keys.left?1:0)-(keys.right?1:0);
  heading+=steer*dt*1.3*Math.min(1,Math.abs(velocity)/4)*Math.sign(velocity||1);
  const nx=car.position.x+Math.sin(heading)*velocity*dt,nz=car.position.z+Math.cos(heading)*velocity*dt;
  const y=roadSurface(nx,nz);
  if(y!==null){car.position.set(nx,THREE.MathUtils.lerp(car.position.y,y,Math.min(1,dt*10)),nz)}
  else velocity=0;
  car.rotation.y=heading;
  if(track.length>3){
   const target=track[checkpoint];
   if(car.position.distanceTo(target)<Math.max(5,Math.min(18,roadBounds.getSize(new THREE.Vector3()).length()*.03))){
    checkpoint=(checkpoint+1)%track.length;
    if(checkpoint===1){laps++;document.querySelector('#lapCounter').textContent=laps;if(laps===3){msg.textContent='مبروك! أكملت 3 لفات';msg.style.display='block';setTimeout(()=>msg.style.display='none',3500)}}
   }
  }
  const behind=new THREE.Vector3(-Math.sin(heading)*7.5,3.6,-Math.cos(heading)*7.5).add(car.position);
  camera.position.lerp(behind,Math.min(1,dt*8));
  look.copy(car.position).add(new THREE.Vector3(0,1.4,0));camera.lookAt(look);
  if(speedEl)speedEl.textContent=Math.round(Math.abs(velocity)*3.6);
 }else{camera.position.set(0,35,55);camera.lookAt(0,0,0)}
 renderer.render(scene,camera);
}
animate();
</script></body></html>
