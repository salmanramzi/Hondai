<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hyundai Elantra N Drive</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101820;font-family:Arial,sans-serif;touch-action:none}#hud{position:absolute;top:12px;left:12px;direction:ltr;color:white;background:#0009;border-radius:12px;padding:12px;font-weight:bold}#status{position:absolute;top:38%;width:100%;text-align:center;color:white;font-size:18px;text-shadow:0 2px 5px black;padding:15px}#controls{position:absolute;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;direction:ltr;pointer-events:none}.group{display:flex;gap:10px}button{pointer-events:auto;border:2px solid #ffffff99;border-radius:16px;background:#162433c9;color:white;font-size:26px;font-weight:bold;width:72px;height:72px;touch-action:none}button:active{background:#3788d4}#reset{position:absolute;top:12px;right:12px;width:auto;height:auto;padding:12px;font-size:14px}#tip{position:absolute;bottom:103px;color:white;text-align:center;width:100%;font-size:13px;text-shadow:0 1px 4px #000}</style></head><body><div id="hud">ELANTRA N<br><span id="speed">0</span> km/h</div><button id="reset">إعادة السيارة</button><div id="status">جاري تحميل الخريطة والسيارة...</div><div id="tip">▲ بنزين · ▼ فرامل / رجوع · ◀ ▶ توجيه</div><div id="controls"><div class="group"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="group"><button data-key="brake">▼</button><button data-key="gas">▲</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const status=document.querySelector('#status'),speedEl=document.querySelector('#speed');const scene=new THREE.Scene();scene.background=new THREE.Color(0xaac9e5);scene.fog=new THREE.Fog(0xaac9e5,100,240);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x666677,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(30,70,25);scene.add(sun);
const loader=new GLTFLoader();const load=(file)=>new Promise((resolve,reject)=>loader.load('./'+file,resolve,undefined,reject));let map,car,heading=0,velocity=0,groundY=0;const keys={left:false,right:false,gas:false,brake:false};let mapBox;
function surface(x,z){if(!map)return groundY;const ray=new THREE.Raycaster(new THREE.Vector3(x,mapBox.max.y+50,z),new THREE.Vector3(0,-1,0),0,500);const hits=ray.intersectObject(map,true);return hits.length?hits[0].point.y:groundY}
function reset(){if(!car)return;velocity=0;heading=0;const cx=(mapBox.min.x+mapBox.max.x)/2,cz=(mapBox.min.z+mapBox.max.z)/2;car.position.set(cx,surface(cx,cz)+0.15,cz);car.rotation.y=heading}
async function start(){try{status.textContent='جاري تحميل الخريطة...';map=(await load('map_njxz.glb')).scene;scene.add(map);map.updateMatrixWorld(true);mapBox=new THREE.Box3().setFromObject(map);groundY=mapBox.min.y;status.textContent='جاري تحميل السيارة...';car=(await load('2021-2023_hyundai_elantra_n.glb')).scene;const original=new THREE.Box3().setFromObject(car);const size=original.getSize(new THREE.Vector3());if(size.length()<0.3){car.scale.multiplyScalar(4.5/Math.max(size.x,size.z));}car.updateMatrixWorld(true);const scaled=new THREE.Box3().setFromObject(car);car.position.y-=scaled.min.y;const body=new THREE.Group();body.add(car);car=body;scene.add(car);reset();status.style.display='none';}catch(err){console.error('Model load error',err);status.textContent='تعذر تحميل المجسمات: '+(err?.message||err)+'. تأكد من رفع ملفات GLB بجانب index.html وتحديث الصفحة.';}}
start();function bind(b){const k=b.dataset.key;const set=v=>{keys[k]=v;b.style.background=v?'#3788d4':''};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>set(false)))}document.querySelectorAll('[data-key]').forEach(bind);document.querySelector('#reset').onclick=reset;const code={ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};addEventListener('keydown',e=>{if(code[e.code]){keys[code[e.code]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(code[e.code])keys[code[e.code]]=false});addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock(),look=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(car){const accel=keys.gas?12:keys.brake?-16:0;velocity+=accel*dt;if(!keys.gas&&!keys.brake)velocity*=Math.exp(-2.0*dt);velocity=Math.max(-10,Math.min(24,velocity));const steer=(keys.left?1:0)-(keys.right?1:0);heading+=steer*dt*1.2*Math.min(1,Math.abs(velocity)/4)*Math.sign(velocity||1);car.rotation.y=heading;const nx=car.position.x+Math.sin(heading)*velocity*dt,nz=car.position.z+Math.cos(heading)*velocity*dt;const margin=3;if(nx>mapBox.min.x+margin&&nx<mapBox.max.x-margin&&nz>mapBox.min.z+margin&&nz<mapBox.max.z-margin){car.position.x=nx;car.position.z=nz;car.position.y=THREE.MathUtils.lerp(car.position.y,surface(nx,nz)+0.15,Math.min(1,dt*5))}else velocity=0;const behind=new THREE.Vector3(-Math.sin(heading)*9,5,-Math.cos(heading)*9).add(car.position);camera.position.lerp(behind,Math.min(1,dt*4));look.copy(car.position).add(new THREE.Vector3(0,1.3,0));camera.lookAt(look);speedEl.textContent=Math.round(Math.abs(velocity)*3.6)}else{camera.position.set(0,35,55);camera.lookAt(0,0,0)}renderer.render(scene,camera)}animate();
</script></body></html>
